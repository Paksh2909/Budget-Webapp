name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'package.json', 'package-lock.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build -w web
        env:
          # Your Worker URL, as a repository Variable (preferred) or Secret named VITE_API_URL
          # (Settings > Secrets and variables > Actions). Not an environment-level variable.
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
